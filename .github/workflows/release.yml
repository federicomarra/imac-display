name: Release

# Every push to main (and manual runs) bump the version by +0.1, build both
# apps (universal, signed by scripts/make-dmg.sh) and publish a .dmg as both a GitHub Release
# and a workflow artifact. The version is derived from the latest git tag
# (no tags => 1.0); CI never commits back to the repo, it only pushes the tag
# and the Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the version tag and create the Release

concurrency:
  group: release-main # serialize runs so two releases can't race
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history + tags, so release notes can list commits

      - name: Compute next version
        run: |
          latest=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          if [ -n "$latest" ]; then
            new=$(awk -v v="${latest#v}" 'BEGIN{printf "%.1f", v + 0.1}')   # v1.9 -> 2.0
          else
            new=1.0                                                          # first release
          fi
          echo "VERSION=$new"       >> "$GITHUB_ENV"
          echo "LATEST_TAG=$latest" >> "$GITHUB_ENV"   # reused as the changelog base
          echo "Building version $new (from tag '${latest:-none}')"

      - name: Import signing certificate
        # Created once by scripts/make-signing-cert.sh. Without these secrets the
        # apps are ad-hoc signed and macOS asks for permissions after every update.
        env:
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$SIGNING_P12" ]; then
            echo "::warning::SIGNING_P12 secret not set, apps will be ad-hoc signed"
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$kc"
          security set-keychain-settings "$kc"   # never auto-lock during the build
          security unlock-keychain -p ci "$kc"
          echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$kc" >/dev/null
          # Add it to the search list so make-dmg.sh finds the certificate.
          security list-keychains -d user -s "$kc" login.keychain

      - name: Build apps + DMG
        # Info.plists read $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION), so the
        # script stamps the version through build settings, no file edits.
        run: scripts/make-dmg.sh "$VERSION" "${{ github.run_number }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: iMacDisplay-${{ env.VERSION }}
          path: dist/iMacDisplay.dmg
          if-no-files-found: error

      - name: Tag and publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Annotated tag under my identity, so the tagger is me, not github-actions.
          git config user.name  "Federico Marra"
          git config user.email "fecrom@gmail.com"
          git tag -a "v$VERSION" -m "iMacDisplay v$VERSION"
          git push origin "v$VERSION"

          range="${LATEST_TAG:+$LATEST_TAG..HEAD}"

          {
            echo "## Novità in questa versione / What's changed"
            echo ""
            git log ${range:+"$range"} --no-merges --pretty=format:'- %s' \
              | grep -v '\[skip ci\]' || echo "- Prima versione."
            echo ""
            echo ""
            # Quoted heredoc: backticks below stay literal Markdown.
            cat <<'EOF'
          ---
          ## Installazione / Installation

          **🇮🇹 Italiano:**
          1. Sul **Mac**: trascina **iMacDisplay.app** nella cartella **Applicazioni**.
          2. Sull'**iMac**: copia **iMacDisplay Receiver.app** nella cartella **Applicazioni**.
          3. Le app non sono notarizzate da Apple. **Prima del primo avvio** apri il Terminale e togli la quarantena (sul Mac la prima riga, sull'iMac la seconda):
             ```sh
             xattr -dr com.apple.quarantine /Applications/iMacDisplay.app
             xattr -dr com.apple.quarantine "/Applications/iMacDisplay Receiver.app"
             ```
             Non usare *Apri comunque* in Impostazioni di Sistema: su macOS 27 l'app resta bloccata all'avvio e macOS dice che "non risponde". Se è già successo, chiudila (`killall iMacDisplay`), esegui il comando e **riavvia il Mac**: il blocco resta finché non si riavvia.

          **🇬🇧 English:**
          1. On the **Mac**: drag **iMacDisplay.app** into **Applications**.
          2. On the **iMac**: copy **iMacDisplay Receiver.app** into **Applications**.
          3. The apps are not notarized by Apple. **Before the first launch** open Terminal and remove the quarantine flag (first line on the Mac, second on the iMac):
             ```sh
             xattr -dr com.apple.quarantine /Applications/iMacDisplay.app
             xattr -dr com.apple.quarantine "/Applications/iMacDisplay Receiver.app"
             ```
             Don't use *Open Anyway* in System Settings: on macOS 27 the app freezes at launch and macOS reports it as "not responding". If that already happened, quit it (`killall iMacDisplay`), run the command and **restart the Mac**: the block stays until you restart.
          EOF
          } > release-notes.md

          gh release create "v$VERSION" dist/iMacDisplay.dmg \
            --title "iMacDisplay v$VERSION" \
            --notes-file release-notes.md
