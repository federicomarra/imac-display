name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: ["iMacDisplay", "iMacDisplay Receiver"]
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build ${{ matrix.target }}
        run: |
          xcodebuild \
            -project iMacDisplay.xcodeproj \
            -target "${{ matrix.target }}" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build
